name: release

# Caller workflow for the PUBLIC site repo. It tags a version, delegates the
# signed APK build to the private repo's reusable workflow (single run, so the
# built artifact is reachable here), and publishes a public GitHub Release with
# the APK assets and the generated changelog.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3 (no leading v)."
        type: string
        required: true
      ref:
        description: "Git ref to build and tag."
        type: string
        required: false
        default: main
  push:
    tags:
      - "v*"

jobs:
  # Derive the version and, for manual dispatch, create + push the tag so both
  # entry points converge on an existing v* tag.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.derive.outputs.version }}
      ref: ${{ steps.derive.outputs.ref }}
    steps:
      - name: Derive version and ref
        id: derive
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: strip the leading v; build the tagged commit.
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  build:
    needs: prepare
    # The reusable build lives in the private code repo. Requires the private
    # repo's Settings -> Actions -> General -> Access to allow org access.
    uses: singlado/singlado/.github/workflows/build-apk.yml@main
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Compose release body
        env:
          CHANGELOG_MD: ${{ needs.build.outputs.changelog_md }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$CHANGELOG_MD"
            echo "---"
            echo "Play-Store release notes are attached as \`release-notes-play.txt\`."
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Singlado ${{ needs.prepare.outputs.version }}
          body_path: release-body.md
          files: |
            dist/singlado-${{ needs.prepare.outputs.version }}.apk
            dist/singlado.apk
            dist/release-notes-play.txt
